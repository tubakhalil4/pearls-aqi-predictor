name: Daily AQI Model Training

   on:
     schedule:
       - cron: "0 2 * * *"
     workflow_dispatch:

   permissions:
     contents: write

   env:
     HOPSWORKS_PROJECT: Tuba_Pearl_Project
     HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}

   jobs:
     train:
       runs-on: ubuntu-latest
       timeout-minutes: 30

       steps:
         - name: Checkout repository
           uses: actions/checkout@v6

         - name: Set up Python
           uses: actions/setup-python@v6
           with:
             python-version: "3.12"
             cache: pip

         - name: Install dependencies
           run: |
             python -m pip install --upgrade pip
             pip install -r requirements.txt

         - name: Validate training pipeline syntax
           run: python -m py_compile pipelines/training_pipeline.py

         - name: Run daily training pipeline
           run: python pipelines/training_pipeline.py

         - name: Commit model comparison report
           run: |
             git config user.name "github-actions[bot]"
             git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
             git add model_comparison_report.csv
             if git diff --cached --quiet; then
               echo "No comparison report changes to commit."
             else
               git commit -m "Update daily model comparison report"
               git push origin HEAD:main
             fi
