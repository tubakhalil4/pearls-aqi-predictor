name: Hourly AQI Production Forecast

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hourly-aqi-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest

    env:
      HOPSWORKS_PROJECT: Tuba_Pearl_Project
      HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install production dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install hopsworks openmeteo-requests requests-cache retry-requests

      - name: Validate production pipeline syntax
        run: |
          python -m py_compile pipelines/hourly_forecast.py

      - name: Run hourly production forecast
        run: |
          python pipelines/hourly_forecast.py

      - name: Validate generated forecast
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          path = Path("forecast_3days.csv")
          assert path.exists(), "forecast_3days.csv was not generated"

          df = pd.read_csv(path)
          required = {
              "city",
              "forecast_origin",
              "current_aqi",
              "aqi_24h",
              "aqi_48h",
              "aqi_72h",
              "forecast_24h_time",
              "forecast_48h_time",
              "forecast_72h_time",
          }

          assert required.issubset(df.columns), "Forecast schema mismatch"
          assert len(df) == 4, f"Expected 4 cities, found {len(df)}"
          assert set(df["city"]) == {
              "Islamabad",
              "Karachi",
              "Lahore",
              "Peshawar",
          }
          assert df[list(required - {"city", "forecast_origin", "forecast_24h_time", "forecast_48h_time", "forecast_72h_time"})].notna().all().all()
          assert (df[["current_aqi", "aqi_24h", "aqi_48h", "aqi_72h"]] >= 0).all().all()

          print("Hourly production forecast validation passed")
          print(df.to_string(index=False))
          PY

      - name: Save forecast artifact to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forecast_3days.csv

          if git diff --cached --quiet; then
            echo "No forecast file changes to commit."
          else
            git commit -m "Update hourly AQI forecast"
            git push origin HEAD:main
          fi
